<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rail Dip Inspector - Field Ops</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; color: #fff;
            overflow: hidden; margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        #container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
        }
        #videoContainer { position: relative; flex: 1; overflow: hidden; background: #000;}
        
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; pointer-events: none;
        }
        
        /* HUD UI */
        #hud {
            position: absolute; top: 20px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; gap: 8px;
            pointer-events: none; z-index: 10;
        }

        .panel {
            background: rgba(0, 0, 0, 0.75);
            padding: 15px 5px; border-radius: 8px;
            border: 1px solid #444;
            backdrop-filter: blur(4px);
            text-align: center;
            flex: 1;
        }

        .panel-label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        
        #current-readout {
            font-size: 36px; font-weight: 800;
            color: #4CAF50; font-variant-numeric: tabular-nums;
        }

        #max-readout {
            font-size: 36px; font-weight: 800;
            color: #FF9800; font-variant-numeric: tabular-nums;
        }

        /* Warnings */
        #warning-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.8); color: white;
            padding: 20px; border-radius: 10px; font-weight: bold; font-size: 24px;
            display: none; text-align: center; z-index: 50; pointer-events: none;
        }

        /* Controls */
        #controls-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, #000 90%, transparent);
            padding: 20px; z-index: 20;
            display: flex; flex-direction: column; gap: 15px;
        }

        #status-bar {
            text-align: center; color: #aaa; font-size: 14px;
        }
        
        .slider-row {
            display: flex; align-items: center; justify-content: space-between;
            color: #ccc; font-size: 12px;
        }
        input[type=range] { width: 60%; }

        #button-bar { display: flex; gap: 15px; }
        
        button {
            flex: 1; padding: 18px; font-size: 16px; border: none; border-radius: 8px;
            background: #333; color: white; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
        }
        button.primary { background: #2196F3; }
        button.warning { background: #FF9800; color: #000; }
        button:active { opacity: 0.8; }
        button:disabled { background: #444; color: #777; }

    </style>
</head>
<body>

    <div id="container">
        <div id="videoContainer">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <div id="warning-overlay">LEVEL PHONE<br><span style="font-size:16px">Tilt Detected</span></div>
        </div>
        
        <div id="hud">
            <div class="panel">
                <div class="panel-label">Current Dip</div>
                <div id="current-readout">0.00"</div>
            </div>
            <div class="panel" style="border-color: #9c5d00;">
                <div class="panel-label" style="color: #FF9800;">Max Hold</div>
                <div id="max-readout">0.00"</div>
            </div>
        </div>

        <div id="controls-wrapper">
            <div id="status-bar">Waiting for camera permission...</div>
            
            <div class="slider-row">
                <span>Response Speed</span>
                <input type="range" id="smoothSlider" min="10" max="100" value="50">
            </div>
            
            <div class="slider-row">
                <span>Light Sens.</span>
                <input type="range" id="thresholdSlider" min="0" max="255" value="100">
            </div>

            <div id="button-bar">
                <button id="startBtn" class="primary">Start Camera</button>
                <button id="zeroBtn" class="warning" disabled>Zero / Tare</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const REAL_DISTANCE_INCHES = 2.0; 
        const MAX_TILT_ANGLE = 5.0; // Degrees

        // --- ELEMENTS ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const currentReadoutEl = document.getElementById('current-readout');
        const maxReadoutEl = document.getElementById('max-readout');
        const statusEl = document.getElementById('status-bar');
        const warningEl = document.getElementById('warning-overlay');
        const startBtn = document.getElementById('startBtn');
        const zeroBtn = document.getElementById('zeroBtn');
        const smoothSlider = document.getElementById('smoothSlider');
        const thresholdSlider = document.getElementById('thresholdSlider');
        
        // --- STATE ---
        let stream = null;
        let isTracking = false;
        
        // Gauge Math
        let zeroY = null;
        let maxDip = 0;
        let pixelsPerInch = 0;
        
        // Smoothing
        let smoothedDip = 0;
        let smoothingFactor = 0.5; // Default middle ground
        
        // Settings
        let detectionThreshold = 100;

        // --- EVENTS ---
        startBtn.addEventListener('click', startCamera);
        
        zeroBtn.addEventListener('click', () => { 
            zeroY = null;    
            maxDip = 0;      
            smoothedDip = 0;
            maxReadoutEl.textContent = '0.00"';
            statusEl.textContent = "Tare Reset";
            setTimeout(() => statusEl.textContent = "Ready", 1500);
        }); 

        smoothSlider.addEventListener('input', (e) => {
            // Map 10-100 to 0.1-1.0
            // 0.1 = Heavy Smoothing (but faster than before)
            // 1.0 = Instant (Raw Data)
            smoothingFactor = e.target.value / 100;
        });
        
        thresholdSlider.addEventListener('input', (e) => { 
            detectionThreshold = parseInt(e.target.value); 
        });

        // --- MAIN FUNCTIONS ---

        async function startCamera() {
            try {
                // Constraints for Mobile Rear Camera
                const constraints = {
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    startBtn.style.display = 'none';
                    zeroBtn.disabled = false;
                    isTracking = true;
                    statusEl.textContent = 'Align markers in frame';
                    processFrame();
                };
            } catch (err) {
                alert("Error: " + err.message + "\nEnsure you are using HTTPS or Localhost.");
            }
        }

        function processFrame() {
            if (!isTracking) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const markers = detectSquareMarkers(imageData);

            if (markers.length >= 2) {
                const m1 = markers[0]; 
                const m2 = markers[1]; 

                // Sort left-to-right
                if (m1.x > m2.x) { 
                    const temp = m1; markers[0] = m2; markers[1] = temp;
                }

                // 1. Calculate Tilt
                const dy = markers[1].y - markers[0].y;
                const dx = markers[1].x - markers[0].x;
                const angleRad = Math.atan2(dy, dx);
                const angleDeg = angleRad * (180 / Math.PI);
                
                // 2. Check Tilt Lock
                if (Math.abs(angleDeg) > MAX_TILT_ANGLE) {
                    warningEl.style.display = "block";
                    drawMarker(markers[0], 'red');
                    drawMarker(markers[1], 'red');
                } else {
                    warningEl.style.display = "none";
                    drawMarker(markers[0], '#00FF00');
                    drawMarker(markers[1], '#00FF00');
                    drawLine(markers[0], markers[1]);

                    // 3. Calculate Physics
                    const pixelDistance = Math.hypot(dx, dy);
                    pixelsPerInch = pixelDistance / REAL_DISTANCE_INCHES;
                    
                    const currentY = (markers[0].y + markers[1].y) / 2;

                    // Auto-Zero on first valid lock
                    if (zeroY === null) {
                        zeroY = currentY;
                        smoothedDip = 0; 
                        statusEl.textContent = "Reference Set";
                        statusEl.style.color = "#4CAF50";
                    }

                    // 4. Calculate Dip & Smooth it
                    const rawDipPixels = currentY - zeroY;
                    const rawDipInches = rawDipPixels / pixelsPerInch;
                    
                    // Apply Low Pass Filter (Smoothing)
                    smoothedDip = smoothedDip + (rawDipInches - smoothedDip) * smoothingFactor;

                    // Update UI
                    updateReadouts(smoothedDip);
                    
                    // Draw Level Line
                    ctx.strokeStyle = 'cyan';
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(0, zeroY); 
                    ctx.lineTo(canvas.width, zeroY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

            } else {
                statusEl.textContent = 'Searching...';
                statusEl.style.color = "#ccc";
                warningEl.style.display = "none";
            }

            requestAnimationFrame(processFrame);
        }

        function updateReadouts(val) {
            const absDip = Math.abs(val);
            // Threshold for display jitter (0.01")
            const displayDip = absDip < 0.01 ? 0 : absDip;
            
            const arrow = val > 0.02 ? "↓ " : (val < -0.02 ? "↑ " : "");
            currentReadoutEl.textContent = arrow + displayDip.toFixed(2) + '"';
            
            if (displayDip > maxDip) {
                maxDip = displayDip;
                maxReadoutEl.textContent = maxDip.toFixed(2) + '"';
            }
        }

        // --- CV LOGIC ---
        function detectSquareMarkers(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const binary = new Uint8Array(width * height);
            
            for (let i = 0; i < width * height; i++) {
                binary[i] = data[i*4+1] < detectionThreshold ? 1 : 0;
            }

            const visited = new Uint8Array(width * height);
            const blobs = [];
            const step = 6; 
            
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    const idx = y * width + x;
                    if (binary[idx] === 1 && visited[idx] === 0) {
                        const blob = floodFill(binary, visited, x, y, width, height);
                        
                        // Quality Filters for 2.0" Gap Print
                        if (blob.pixels > 300 && blob.pixels < 40000) {
                            const fillRatio = blob.pixels / (blob.w * blob.h);
                            const aspect = blob.w / blob.h;
                            if (fillRatio > 0.45 && aspect > 0.6 && aspect < 1.6) {
                                blobs.push(blob);
                            }
                        }
                    }
                }
            }
            blobs.sort((a, b) => b.pixels - a.pixels);
            return blobs.slice(0, 2);
        }

        function floodFill(binary, visited, startX, startY, width, height) {
            const stack = [startX, startY];
            let pixels = 0, sumX = 0, sumY = 0;
            let minX = startX, maxX = startX, minY = startY, maxY = startY;

            while (stack.length > 0) {
                const y = stack.pop();
                const x = stack.pop();
                const idx = y * width + x;

                if (visited[idx]) continue;
                visited[idx] = 1;
                pixels++; sumX += x; sumY += y;
                
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;

                if (x < width - 1 && binary[y*width+x+1]) stack.push(x+1, y);
                if (x > 0 && binary[y*width+x-1]) stack.push(x-1, y);
                if (y < height - 1 && binary[(y+1)*width+x]) stack.push(x, y+1);
                if (y > 0 && binary[(y-1)*width+x]) stack.push(x, y-1);
            }

            return { x: sumX/pixels, y: sumY/pixels, w: maxX-minX, h: maxY-minY, pixels: pixels };
        }

        // --- DRAWING ---
        function drawMarker(m, color) {
            const size = Math.max(m.w, m.h);
            ctx.strokeStyle = color; ctx.lineWidth = 3;
            ctx.strokeRect(m.x - size/2, m.y - size/2, size, size);
        }
        function drawLine(m1, m2) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 2; ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();
        }

    </script>
</body>
</html>
