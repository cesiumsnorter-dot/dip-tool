<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rail Dip Inspector - Mobile</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; color: #fff;
            margin: 0; padding: 0;
            overflow: hidden; /* Stop scrolling completely */
            width: 100vw; 
            height: 100dvh; /* Dynamic Height: fits between browser bars */
        }

        #container {
            position: relative; width: 100%; height: 100%;
        }

        /* Video Layer - Fills the screen */
        #video-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        
        video {
            width: 100%; height: 100%;
            object-fit: cover; /* Ensures video fills screen, might crop edges */
        }
        
        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; pointer-events: none;
        }

        /* UI Layer - Floats on top */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Let touches pass through to video/buttons */
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top HUD */
        #hud {
            padding: 15px;
            display: flex; gap: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            text-align: center;
            flex: 1;
        }

        .panel-label { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        
        .readout {
            font-size: 28px; font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        #current-readout { color: #4CAF50; }
        #max-readout { color: #FF9800; }

        /* WARNING OVERLAY (Tilt) */
        #warning-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9); color: white;
            padding: 30px; border-radius: 15px; font-weight: bold; font-size: 20px;
            text-align: center; z-index: 100; pointer-events: none; display: none;
            width: 80%;
        }

        /* Bottom Controls - Fixed to bottom */
        #controls-wrapper {
            pointer-events: auto; /* Re-enable touching */
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 15px 30px 15px; /* Extra bottom padding for safe area */
            border-top: 1px solid #333;
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: env(safe-area-inset-bottom, 20px); /* Handle iPhone notches */
        }

        #status-bar {
            text-align: center; color: #888; font-size: 12px; margin-bottom: 5px;
        }
        
        .slider-row {
            display: flex; align-items: center; justify-content: space-between;
            color: #ccc; font-size: 12px;
        }
        input[type=range] { width: 65%; height: 30px; } /* Taller slider for fat fingers */

        #button-bar { display: flex; gap: 10px; }
        
        button {
            flex: 1; padding: 15px 0; font-size: 14px; border: none; border-radius: 6px;
            background: #333; color: white; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            touch-action: manipulation; /* Improves touch response */
        }
        button.primary { background: #2196F3; }
        button.warning { background: #FF9800; color: #000; }
        button:active { opacity: 0.7; transform: scale(0.98); }
        button:disabled { background: #222; color: #555; }

    </style>
</head>
<body>

    <div id="container">
        <div id="video-layer">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <div id="warning-overlay">⚠️ LEVEL PHONE ⚠️<br><span style="font-size:14px; opacity:0.8; font-weight:normal">Tilt Detected</span></div>
        </div>
        
        <div id="ui-layer">
            <div id="hud">
                <div class="panel">
                    <div class="panel-label">Current Dip</div>
                    <div id="current-readout" class="readout">0.00"</div>
                </div>
                <div class="panel" style="border-color: #9c5d00;">
                    <div class="panel-label" style="color: #FF9800;">Max Hold</div>
                    <div id="max-readout" class="readout">0.00"</div>
                </div>
            </div>

            <div id="controls-wrapper">
                <div id="status-bar">Tap Start to begin</div>
                
                <div class="slider-row">
                    <span>Response Speed</span>
                    <input type="range" id="smoothSlider" min="10" max="100" value="50">
                </div>
                
                <div class="slider-row">
                    <span>Light Sensitivity</span>
                    <input type="range" id="thresholdSlider" min="0" max="255" value="100">
                </div>

                <div id="button-bar">
                    <button id="startBtn" class="primary">Start Camera</button>
                    <button id="zeroBtn" class="warning" disabled>Zero / Tare</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const REAL_DISTANCE_INCHES = 2.0; 
        const MAX_TILT_ANGLE = 5.0; // Degrees

        // --- ELEMENTS ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const currentReadoutEl = document.getElementById('current-readout');
        const maxReadoutEl = document.getElementById('max-readout');
        const statusEl = document.getElementById('status-bar');
        const warningEl = document.getElementById('warning-overlay');
        const startBtn = document.getElementById('startBtn');
        const zeroBtn = document.getElementById('zeroBtn');
        
        // --- STATE ---
        let stream = null;
        let isTracking = false;
        let zeroY = null;
        let maxDip = 0;
        let smoothedDip = 0;
        let smoothingFactor = 0.5; 
        let detectionThreshold = 100;

        // --- EVENTS ---
        startBtn.addEventListener('click', startCamera);
        
        zeroBtn.addEventListener('click', () => { 
            zeroY = null;    
            maxDip = 0;      
            smoothedDip = 0;
            maxReadoutEl.textContent = '0.00"';
            statusEl.textContent = "Tare Reset";
            setTimeout(() => statusEl.textContent = "Ready", 1500);
        }); 

        document.getElementById('smoothSlider').addEventListener('input', (e) => {
            smoothingFactor = e.target.value / 100;
        });
        
        document.getElementById('thresholdSlider').addEventListener('input', (e) => { 
            detectionThreshold = parseInt(e.target.value); 
        });

        // --- MAIN FUNCTIONS ---
        async function startCamera() {
            try {
                // Request best possible resolution for rear camera
                const constraints = {
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    // Match canvas to internal video resolution
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    startBtn.style.display = 'none';
                    zeroBtn.disabled = false;
                    isTracking = true;
                    statusEl.textContent = 'Align markers in frame';
                    processFrame();
                };
            } catch (err) {
                alert("Camera Error: " + err.message);
            }
        }

        function processFrame() {
            if (!isTracking) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const markers = detectSquareMarkers(imageData);

            if (markers.length >= 2) {
                const m1 = markers[0]; 
                const m2 = markers[1]; 

                // Sort left-to-right
                if (m1.x > m2.x) { const temp = m1; markers[0] = m2; markers[1] = temp; }

                // 1. Calculate Tilt
                const dy = markers[1].y - markers[0].y;
                const dx = markers[1].x - markers[0].x;
                const angleRad = Math.atan2(dy, dx);
                const angleDeg = angleRad * (180 / Math.PI);
                
                if (Math.abs(angleDeg) > MAX_TILT_ANGLE) {
                    warningEl.style.display = "block";
                    drawMarker(markers[0], 'red');
                    drawMarker(markers[1], 'red');
                } else {
                    warningEl.style.display = "none";
                    drawMarker(markers[0], '#00FF00');
                    drawMarker(markers[1], '#00FF00');
                    drawLine(markers[0], markers[1]);

                    const pixelDistance = Math.hypot(dx, dy);
                    const pixelsPerInch = pixelDistance / REAL_DISTANCE_INCHES;
                    
                    const currentY = (markers[0].y + markers[1].y) / 2;

                    if (zeroY === null) {
                        zeroY = currentY;
                        smoothedDip = 0; 
                        statusEl.textContent = "Reference Set";
                        statusEl.style.color = "#4CAF50";
                    }

                    const rawDipPixels = currentY - zeroY;
                    const rawDipInches = rawDipPixels / pixelsPerInch;
                    
                    smoothedDip = smoothedDip + (rawDipInches - smoothedDip) * smoothingFactor;
                    updateReadouts(smoothedDip);
                    
                    // Draw Level Line
                    ctx.strokeStyle = 'cyan';
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, zeroY); 
                    ctx.lineTo(canvas.width, zeroY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

            } else {
                statusEl.textContent = 'Searching...';
                statusEl.style.color = "#ccc";
                warningEl.style.display = "none";
            }

            requestAnimationFrame(processFrame);
        }

        function updateReadouts(val) {
            const absDip = Math.abs(val);
            const displayDip = absDip < 0.01 ? 0 : absDip;
            const arrow = val > 0.02 ? "↓ " : (val < -0.02 ? "↑ " : "");
            
            currentReadoutEl.textContent = arrow + displayDip.toFixed(2) + '"';
            
            if (displayDip > maxDip) {
                maxDip = displayDip;
                maxReadoutEl.textContent = maxDip.toFixed(2) + '"';
            }
        }

        // --- CV LOGIC (Identical to before) ---
        function detectSquareMarkers(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const binary = new Uint8Array(width * height);
            
            for (let i = 0; i < width * height; i++) {
                binary[i] = data[i*4+1] < detectionThreshold ? 1 : 0;
            }

            const visited = new Uint8Array(width * height);
            const blobs = [];
            const step = 6; 
            
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    const idx = y * width + x;
                    if (binary[idx] === 1 && visited[idx] === 0) {
                        const blob = floodFill(binary, visited, x, y, width, height);
                        if (blob.pixels > 300 && blob.pixels < 40000) {
                            const fillRatio = blob.pixels / (blob.w * blob.h);
                            const aspect = blob.w / blob.h;
                            if (fillRatio > 0.45 && aspect > 0.6 && aspect < 1.6) {
                                blobs.push(blob);
                            }
                        }
                    }
                }
            }
            blobs.sort((a, b) => b.pixels - a.pixels);
            return blobs.slice(0, 2);
        }

        function floodFill(binary, visited, startX, startY, width, height) {
            const stack = [startX, startY];
            let pixels = 0, sumX = 0, sumY = 0;
            let minX = startX, maxX = startX, minY = startY, maxY = startY;

            while (stack.length > 0) {
                const y = stack.pop();
                const x = stack.pop();
                const idx = y * width + x;

                if (visited[idx]) continue;
                visited[idx] = 1;
                pixels++; sumX += x; sumY += y;
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;

                if (x < width - 1 && binary[y*width+x+1]) stack.push(x+1, y);
                if (x > 0 && binary[y*width+x-1]) stack.push(x-1, y);
                if (y < height - 1 && binary[(y+1)*width+x]) stack.push(x, y+1);
                if (y > 0 && binary[(y-1)*width+x]) stack.push(x, y-1);
            }
            return { x: sumX/pixels, y: sumY/pixels, w: maxX-minX, h: maxY-minY, pixels: pixels };
        }

        function drawMarker(m, color) {
            const size = Math.max(m.w, m.h);
            ctx.strokeStyle = color; ctx.lineWidth = 4;
            ctx.strokeRect(m.x - size/2, m.y - size/2, size, size);
        }
        function drawLine(m1, m2) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 3; ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();
        }
    </script>
</body>
</html>
