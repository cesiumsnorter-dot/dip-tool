<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rail Dip Inspector - Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; color: #fff;
            margin: 0; padding: 0; overflow: hidden; 
            width: 100vw; height: 100dvh;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* Layers */
        #video-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top HUD */
        #hud {
            padding: 15px; display: flex; gap: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        .panel {
            background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);
            text-align: center; flex: 1;
        }
        .panel-label { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: 700; margin-bottom: 2px; }
        .readout { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
        #current-readout { color: #4CAF50; }
        #max-readout { color: #FF9800; }

        /* Controls Area */
        #controls-wrapper {
            pointer-events: auto; background: rgba(0, 0, 0, 0.9);
            padding: 15px 15px 30px 15px; border-top: 1px solid #333;
            display: flex; flex-direction: column; gap: 12px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        #status-bar { text-align: center; color: #888; font-size: 12px; margin-bottom: 5px; min-height: 15px; }
        
        .slider-row { display: flex; align-items: center; justify-content: space-between; color: #ccc; font-size: 12px; }
        input[type=range] { width: 65%; height: 30px; }

        #button-bar { display: flex; gap: 10px; }
        
        button {
            flex: 1; padding: 15px 0; font-size: 14px; border: none; border-radius: 6px;
            background: #333; color: white; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px;
            touch-action: manipulation;
        }
        button.primary { background: #2196F3; }
        button.warning { background: #FF9800; color: #000; }
        button.success { background: #4CAF50; }
        button:active { opacity: 0.7; transform: scale(0.98); }
        button:disabled { background: #222; color: #555; }

        /* Export Link */
        #export-link {
            text-align: center; color: #2196F3; font-size: 14px; 
            text-decoration: underline; margin-top: 5px; cursor: pointer;
            display: none; /* Hidden until data exists */
        }

        #warning-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9); color: white;
            padding: 20px; border-radius: 15px; font-weight: bold; font-size: 18px;
            text-align: center; z-index: 100; pointer-events: none; display: none; width: 80%;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="video-layer">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <div id="warning-overlay">⚠️ LEVEL PHONE ⚠️<br><span style="font-size:14px; opacity:0.8; font-weight:normal">Tilt Detected</span></div>
        </div>
        
        <div id="ui-layer">
            <div id="hud">
                <div class="panel">
                    <div class="panel-label">Current Dip</div>
                    <div id="current-readout" class="readout">0.00"</div>
                </div>
                <div class="panel" style="border-color: #9c5d00;">
                    <div class="panel-label" style="color: #FF9800;">Max Hold</div>
                    <div id="max-readout" class="readout">0.00"</div>
                </div>
            </div>

            <div id="controls-wrapper">
                <div id="status-bar">Tap Start to begin</div>
                
                <div class="slider-row">
                    <span>Response Speed</span>
                    <input type="range" id="smoothSlider" min="10" max="100" value="50">
                </div>
                
                <div class="slider-row">
                    <span>Light Sensitivity</span>
                    <input type="range" id="thresholdSlider" min="0" max="255" value="100">
                </div>

                <div id="button-bar">
                    <button id="startBtn" class="primary">Start Camera</button>
                    <button id="zeroBtn" class="warning" style="display:none;" disabled>Zero / Tare</button>
                    <button id="saveBtn" class="success" style="display:none;" disabled>Save Record</button>
                </div>

                <div id="export-link" onclick="downloadCSV()">📥 Export Data (0)</div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const REAL_DISTANCE_INCHES = 2.0; 
        const MAX_TILT_ANGLE = 5.0; 
        const PROCESSING_DOWNSAMPLE = 4;
        const TARGET_FPS = 30;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;

        let logs = []; // Storage for CSV data

        // --- ELEMENTS ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const procCanvas = document.createElement('canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

        const currentReadoutEl = document.getElementById('current-readout');
        const maxReadoutEl = document.getElementById('max-readout');
        const statusEl = document.getElementById('status-bar');
        const warningEl = document.getElementById('warning-overlay');
        const startBtn = document.getElementById('startBtn');
        const zeroBtn = document.getElementById('zeroBtn');
        const saveBtn = document.getElementById('saveBtn');
        const exportLink = document.getElementById('export-link');

        // --- APP STATE ---
        let stream = null;
        let isTracking = false;
        let zeroY = null;
        let maxDip = 0;
        let smoothedDip = 0;
        let smoothingFactor = 0.5; 
        let detectionThreshold = 100;
        let lastFrameTime = 0;

        // --- EVENTS ---
        startBtn.addEventListener('click', startCamera);
        
        zeroBtn.addEventListener('click', () => { 
            zeroY = null; maxDip = 0; smoothedDip = 0;
            maxReadoutEl.textContent = '0.00"';
            statusEl.textContent = "Tare Reset";
        }); 

        // SAVE BUTTON LOGIC
        saveBtn.addEventListener('click', () => {
            if(maxDip === 0) {
                statusEl.textContent = "No dip to save!";
                return;
            }

            statusEl.textContent = "Getting GPS...";
            
            // Get Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        logData(position.coords.latitude, position.coords.longitude);
                    }, 
                    (error) => {
                        logData("No GPS", "No GPS"); // Save anyway if GPS fails
                    }
                );
            } else {
                logData("N/A", "N/A");
            }
        });

        document.getElementById('smoothSlider').addEventListener('input', (e) => smoothingFactor = e.target.value / 100);
        document.getElementById('thresholdSlider').addEventListener('input', (e) => detectionThreshold = parseInt(e.target.value));

        // --- LOGGING FUNCTIONS ---
        function logData(lat, long) {
            const now = new Date();
            const timestamp = now.toLocaleDateString() + " " + now.toLocaleTimeString();
            
            logs.push({
                timestamp: timestamp,
                maxDip: maxDip.toFixed(3), // 3 decimal precision for logs
                latitude: lat,
                longitude: long
            });

            // Update UI
            exportLink.textContent = `📥 Export Data (${logs.length})`;
            exportLink.style.display = "block";
            
            // Auto-Reset for next train
            maxDip = 0;
            maxReadoutEl.textContent = '0.00"';
            
            statusEl.textContent = "✅ Saved! Gauge Reset.";
            statusEl.style.color = "#4CAF50";
            setTimeout(() => { statusEl.style.color = "#888"; statusEl.textContent = "Ready for next"; }, 2000);
        }

        window.downloadCSV = function() {
            if(logs.length === 0) return;
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Timestamp,Max Dip (Inches),Latitude,Longitude\n"; // Header
            
            logs.forEach(row => {
                csvContent += `${row.timestamp},${row.maxDip},${row.latitude},${row.longitude}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            // File Name: "RailDip_YYYY-MM-DD.csv"
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `RailDip_Log_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- CAMERA & CV ENGINE (Optimized) ---
        async function startCamera() {
            try {
                const constraints = {
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    procCanvas.width = video.videoWidth / PROCESSING_DOWNSAMPLE;
                    procCanvas.height = video.videoHeight / PROCESSING_DOWNSAMPLE;
                    
                    startBtn.style.display = 'none';
                    zeroBtn.style.display = 'block'; zeroBtn.disabled = false;
                    saveBtn.style.display = 'block'; saveBtn.disabled = false;
                    
                    isTracking = true;
                    statusEl.textContent = 'Align markers in frame';
                    processFrame();
                };
            } catch (err) { alert("Camera Error: " + err.message); }
        }

        function processFrame(currentTime) {
            if (!isTracking) return;
            requestAnimationFrame(processFrame);
            if (currentTime - lastFrameTime < FRAME_INTERVAL) return;
            lastFrameTime = currentTime;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
            const imageData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
            const markersLowRes = detectSquareMarkers(imageData);

            if (markersLowRes.length >= 2) {
                const m1 = scaleMarker(markersLowRes[0], PROCESSING_DOWNSAMPLE);
                const m2 = scaleMarker(markersLowRes[1], PROCESSING_DOWNSAMPLE);
                const markers = (m1.x > m2.x) ? [m2, m1] : [m1, m2];

                const dy = markers[1].y - markers[0].y;
                const dx = markers[1].x - markers[0].x;
                const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
                
                if (Math.abs(angleDeg) > MAX_TILT_ANGLE) {
                    warningEl.style.display = "block";
                    drawMarker(markers[0], 'red'); drawMarker(markers[1], 'red');
                } else {
                    warningEl.style.display = "none";
                    drawMarker(markers[0], '#00FF00'); drawMarker(markers[1], '#00FF00');
                    drawLine(markers[0], markers[1]);

                    const pixelDistance = Math.hypot(dx, dy);
                    const pixelsPerInch = pixelDistance / REAL_DISTANCE_INCHES;
                    const currentY = (markers[0].y + markers[1].y) / 2;

                    if (zeroY === null) {
                        zeroY = currentY; smoothedDip = 0; 
                        statusEl.textContent = "Reference Set"; statusEl.style.color = "#4CAF50";
                    }

                    const rawDipInches = (currentY - zeroY) / pixelsPerInch;
                    smoothedDip = smoothedDip + (rawDipInches - smoothedDip) * smoothingFactor;
                    updateReadouts(smoothedDip);
                    
                    ctx.strokeStyle = 'cyan'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(canvas.width, zeroY); ctx.stroke(); ctx.setLineDash([]);
                }
            } else {
                statusEl.textContent = 'Searching...'; statusEl.style.color = "#ccc"; warningEl.style.display = "none";
            }
        }

        function scaleMarker(m, scale) { return { x: m.x * scale, y: m.y * scale, w: m.w * scale, h: m.h * scale }; }

        function updateReadouts(val) {
            const absDip = Math.abs(val);
            const displayDip = absDip < 0.01 ? 0 : absDip;
            const arrow = val > 0.02 ? "↓ " : (val < -0.02 ? "↑ " : "");
            currentReadoutEl.textContent = arrow + displayDip.toFixed(2) + '"';
            if (displayDip > maxDip) { maxDip = displayDip; maxReadoutEl.textContent = maxDip.toFixed(2) + '"'; }
        }

        // --- CV UTILS ---
        function detectSquareMarkers(imageData) {
            const width = imageData.width; const height = imageData.height;
            const data = imageData.data; const binary = new Uint8Array(width * height);
            for (let i = 0; i < width * height; i++) binary[i] = data[i*4+1] < detectionThreshold ? 1 : 0;

            const visited = new Uint8Array(width * height);
            const blobs = []; const step = 2; 
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    const idx = y * width + x;
                    if (binary[idx] === 1 && visited[idx] === 0) {
                        const blob = floodFill(binary, visited, x, y, width, height);
                        if (blob.pixels > 20 && blob.pixels < 3000) { 
                            const fillRatio = blob.pixels / (blob.w * blob.h);
                            const aspect = blob.w / blob.h;
                            if (fillRatio > 0.45 && aspect > 0.6 && aspect < 1.6) blobs.push(blob);
                        }
                    }
                }
            }
            blobs.sort((a, b) => b.pixels - a.pixels);
            return blobs.slice(0, 2);
        }

        function floodFill(binary, visited, startX, startY, width, height) {
            const stack = [startX, startY];
            let pixels = 0, sumX = 0, sumY = 0;
            let minX = startX, maxX = startX, minY = startY, maxY = startY;
            while (stack.length > 0) {
                const y = stack.pop(); const x = stack.pop(); const idx = y * width + x;
                if (visited[idx]) continue;
                visited[idx] = 1; pixels++; sumX += x; sumY += y;
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
                if (x < width - 1 && binary[y*width+x+1]) stack.push(x+1, y);
                if (x > 0 && binary[y*width+x-1]) stack.push(x-1, y);
                if (y < height - 1 && binary[(y+1)*width+x]) stack.push(x, y+1);
                if (y > 0 && binary[(y-1)*width+x]) stack.push(x, y-1);
            }
            return { x: sumX/pixels, y: sumY/pixels, w: maxX-minX, h: maxY-minY, pixels: pixels };
        }

        function drawMarker(m, color) {
            const size = Math.max(m.w, m.h); ctx.strokeStyle = color; ctx.lineWidth = 4;
            ctx.strokeRect(m.x - size/2, m.y - size/2, size, size);
        }
        function drawLine(m1, m2) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.lineWidth = 3; ctx.moveTo(m1.x, m1.y); ctx.lineTo(m2.x, m2.y); ctx.stroke();
        }
    </script>
</body>
</html>
